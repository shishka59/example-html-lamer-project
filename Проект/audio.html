<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analyzer Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .header p {
            color: #a0a0a0;
            font-size: 1rem;
        }

        .drop-zone {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 2px dashed rgba(100, 200, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
        }

        .drop-zone:hover {
            border-color: rgba(100, 200, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .drop-zone.drag-over {
            border-color: #64c8ff;
            background: rgba(100, 200, 255, 0.1);
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .drop-zone-text {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            color: #888;
            font-size: 0.9rem;
        }

        .progress-container {
            display: none;
            margin-bottom: 30px;
            animation: fadeIn 0.3s ease-out;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #64c8ff, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .info-card {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .album-art {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .album-art-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .track-artist {
            color: #a0a0a0;
            font-size: 1rem;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .spec-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .spec-label {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .spec-value {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .spec-value.highlight {
            color: #64c8ff;
        }

        .player {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64c8ff, #8b5cf6);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .time-display {
            color: #a0a0a0;
            font-size: 0.9rem;
            min-width: 100px;
            text-align: center;
        }

        .waveform {
            flex: 1;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .waveform-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(100, 200, 255, 0.3), rgba(139, 92, 246, 0.3));
            width: 0%;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-icon {
            color: #a0a0a0;
            font-size: 1.2rem;
        }

        input[type="range"] {
            width: 80px;
            height: 4px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #64c8ff;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #64c8ff;
            cursor: pointer;
            border: none;
        }

        .reset-button {
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .reset-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        input[type="file"] {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .drop-zone {
                padding: 40px 20px;
            }

            .specs-grid {
                grid-template-columns: 1fr;
            }

            .info-header {
                flex-direction: column;
                text-align: center;
            }

            .player-controls {
                flex-wrap: wrap;
            }

            .volume-control {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎵 Audio Analyzer Pro</h1>
        <p>Анализируйте аудиофайлы мгновенно и конфиденциально</p>
    </div>

    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">🎧</div>
        <div class="drop-zone-text">Перетащите аудиофайл сюда</div>
        <div class="drop-zone-hint">или нажмите для выбора (MP3, WAV, FLAC, OGG, M4A)</div>
        <input type="file" id="fileInput" accept="audio/*">
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <div class="info-header">
            <div id="albumArtContainer"></div>
            <div class="track-info">
                <div class="track-title" id="trackTitle">Неизвестный трек</div>
                <div class="track-artist" id="trackArtist">Неизвестный исполнитель</div>
            </div>
        </div>

        <div class="specs-grid">
            <div class="spec-item">
                <div class="spec-label">Битрейт</div>
                <div class="spec-value highlight" id="bitrate">—</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Частота</div>
                <div class="spec-value" id="sampleRate">—</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Длительность</div>
                <div class="spec-value" id="duration">—</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Каналы</div>
                <div class="spec-value" id="channels">—</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Формат</div>
                <div class="spec-value" id="format">—</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Размер файла</div>
                <div class="spec-value" id="fileSize">—</div>
            </div>
        </div>

        <div class="player">
            <div class="player-controls">
                <button class="play-button" id="playButton">▶️</button>
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                <div class="waveform" id="waveform">
                    <div class="waveform-progress" id="waveformProgress"></div>
                </div>
                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="70">
                </div>
            </div>
        </div>

        <button class="reset-button" id="resetButton">Загрузить другой файл</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/music-metadata-browser@2.5.10/dist/music-metadata-browser.min.js"></script>
<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const infoCard = document.getElementById('infoCard');
    const playButton = document.getElementById('playButton');
    const timeDisplay = document.getElementById('timeDisplay');
    const waveform = document.getElementById('waveform');
    const waveformProgress = document.getElementById('waveformProgress');
    const volumeSlider = document.getElementById('volumeSlider');
    const resetButton = document.getElementById('resetButton');

    let audioElement = new Audio();
    let isPlaying = false;

    // Drag and drop handlers
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('audio/')) {
            processFile(file);
        }
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            processFile(file);
        }
    });

    async function processFile(file) {
        // Show progress
        dropZone.style.display = 'none';
        progressContainer.style.display = 'block';
        infoCard.style.display = 'none';

        animateProgress();

        try {
            // Parse metadata
            const metadata = await musicMetadataBrowser.parseBlob(file);

            // Create audio URL
            const audioUrl = URL.createObjectURL(file);
            audioElement.src = audioUrl;

            // Get audio context info
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Wait for audio to load
            await new Promise((resolve) => {
                audioElement.addEventListener('loadedmetadata', resolve, { once: true });
            });

            // Extract data
            const bitrate = metadata.format.bitrate ? Math.round(metadata.format.bitrate / 1000) : 'N/A';
            const sampleRate = metadata.format.sampleRate || audioContext.sampleRate;
            const duration = metadata.format.duration || audioElement.duration;
            const channels = metadata.format.numberOfChannels || 2;
            const codec = metadata.format.codec || metadata.format.container || file.type.split('/')[1].toUpperCase();

            // Get artwork
            let artworkUrl = null;
            if (metadata.common.picture && metadata.common.picture.length > 0) {
                const picture = metadata.common.picture[0];
                const blob = new Blob([picture.data], { type: picture.format });
                artworkUrl = URL.createObjectURL(blob);
            }

            // Display info
            displayAudioInfo({
                title: metadata.common.title || file.name,
                artist: metadata.common.artist || 'Неизвестный исполнитель',
                artwork: artworkUrl,
                bitrate: bitrate !== 'N/A' ? `${bitrate} kbps` : 'N/A',
                sampleRate: `${sampleRate} Hz`,
                duration: formatDuration(duration),
                channels: channels === 1 ? 'Моно' : channels === 2 ? 'Стерео' : `${channels} каналов`,
                format: codec,
                fileSize: formatFileSize(file.size)
            });

            progressContainer.style.display = 'none';
            infoCard.style.display = 'block';

        } catch (error) {
            console.error('Error processing file:', error);
            alert('Ошибка при обработке файла. Попробуйте другой формат.');
            resetApp();
        }
    }

    function animateProgress() {
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress >= 90) {
                progress = 90;
                clearInterval(interval);
            }
            progressFill.style.width = `${progress}%`;
        }, 100);
    }

    function displayAudioInfo(info) {
        document.getElementById('trackTitle').textContent = info.title;
        document.getElementById('trackArtist').textContent = info.artist;

        const albumArtContainer = document.getElementById('albumArtContainer');
        if (info.artwork) {
            albumArtContainer.innerHTML = `<img src="${info.artwork}" alt="Album Art" class="album-art">`;
        } else {
            albumArtContainer.innerHTML = `<div class="album-art-placeholder">🎵</div>`;
        }

        document.getElementById('bitrate').textContent = info.bitrate;
        document.getElementById('sampleRate').textContent = info.sampleRate;
        document.getElementById('duration').textContent = info.duration;
        document.getElementById('channels').textContent = info.channels;
        document.getElementById('format').textContent = info.format;
        document.getElementById('fileSize').textContent = info.fileSize;

        progressFill.style.width = '100%';
    }

    function formatDuration(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // Player controls
    playButton.addEventListener('click', () => {
        if (isPlaying) {
            audioElement.pause();
            playButton.textContent = '▶️';
        } else {
            audioElement.play();
            playButton.textContent = '⏸️';
        }
        isPlaying = !isPlaying;
    });

    audioElement.addEventListener('timeupdate', () => {
        const progress = (audioElement.currentTime / audioElement.duration) * 100;
        waveformProgress.style.width = `${progress}%`;
        timeDisplay.textContent = `${formatDuration(audioElement.currentTime)} / ${formatDuration(audioElement.duration)}`;
    });

    audioElement.addEventListener('ended', () => {
        playButton.textContent = '▶️';
        isPlaying = false;
        waveformProgress.style.width = '0%';
    });

    waveform.addEventListener('click', (e) => {
        const rect = waveform.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const percentage = x / rect.width;
        audioElement.currentTime = percentage * audioElement.duration;
    });

    volumeSlider.addEventListener('input', (e) => {
        audioElement.volume = e.target.value / 100;
    });

    // Set initial volume
    audioElement.volume = 0.7;

    resetButton.addEventListener('click', resetApp);

    function resetApp() {
        audioElement.pause();
        audioElement.src = '';
        isPlaying = false;
        playButton.textContent = '▶️';
        waveformProgress.style.width = '0%';

        dropZone.style.display = 'block';
        progressContainer.style.display = 'none';
        infoCard.style.display = 'none';
        progressFill.style.width = '0%';
        fileInput.value = '';
    }
</script>
</body>
</html>
