<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Locator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://mapgl.2gis.com/api/js/v1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; }
        #map { height: 500px; width: 100%; }
        .custom-shadow { box-shadow: 0 20px 50px -12px rgba(22, 101, 52, 0.12); }
        .accuracy-transition { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="text-slate-900 min-h-screen pb-10">

<div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-col items-center text-center mb-10">
        <h1 class="text-4xl font-extrabold text-green-900 mb-2 tracking-tight">IP Локатор</h1>
        <p class="text-green-700/70 font-medium">Определение провайдера и точных координат</p>
    </div>

    <div class="bg-white rounded-[2.5rem] p-4 md:p-6 custom-shadow border border-green-100 mb-8">
        <div class="flex flex-col md:flex-row gap-3">
            <div class="relative flex-grow">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                    <i data-lucide="search" class="text-green-500 w-5 h-5"></i>
                </div>
                <label for="ipInput"></label><input type="text" id="ipInput" placeholder="Введите IP (например: 8.8.8.8)"
                                                    class="block w-full pl-14 pr-4 py-5 bg-green-50/50 border-none rounded-3xl focus:ring-2 focus:ring-green-500 transition-all text-lg font-semibold">
            </div>
            <div class="flex gap-2">
                <button onclick="lookupIP()" id="searchBtn"
                        class="flex-grow md:flex-none bg-green-600 hover:bg-green-700 text-white font-bold px-10 py-5 rounded-3xl transition-all flex items-center justify-center gap-3 shadow-lg shadow-green-200 active:scale-95">
                    <span>Найти</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
                <button onclick="resetApp()"
                        class="bg-white border-2 border-green-100 hover:bg-green-50 text-green-600 p-5 rounded-3xl transition-all active:scale-95" title="Очистить">
                    <i data-lucide="eraser" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-[2rem] border border-green-100 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-green-800 uppercase tracking-widest">Точность данных</span>
                    <span id="accuracyVal" class="text-green-600 font-extrabold text-lg">0%</span>
                </div>
                <div class="w-full bg-green-50 h-3 rounded-full overflow-hidden">
                    <div id="accuracyBar" class="bg-green-500 h-full accuracy-transition" style="width: 0"></div>
                </div>
                <p id="accuracyType" class="text-[11px] text-slate-400 mt-3 font-medium text-center">—</p>
            </div>

            <div class="space-y-4">
                <div class="bg-white p-6 rounded-3xl border border-green-50 flex items-center gap-4 shadow-sm">
                    <div class="bg-green-100 p-3 rounded-2xl text-green-600"><i data-lucide="building"></i></div>
                    <div class="min-w-0">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Провайдер</p>
                        <p id="resISP" class="text-base font-bold text-slate-800 truncate">—</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-green-50 flex items-center gap-4 shadow-sm">
                    <div class="bg-blue-100 p-3 rounded-2xl text-blue-600"><i data-lucide="map-pin"></i></div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Город</p>
                        <p id="resCity" class="text-base font-bold text-slate-800">—</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-green-50 flex items-center gap-4 shadow-sm">
                    <div class="bg-orange-100 p-3 rounded-2xl text-orange-600"><i data-lucide="hash"></i></div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Координаты</p>
                        <p id="resCoords" class="text-base font-bold text-slate-800 tracking-tight">—</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="bg-white p-3 rounded-[3rem] shadow-2xl border border-green-100 overflow-hidden relative">
                <div id="map" class="rounded-[2.2rem]"></div>
                <div id="mapLoader" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex items-center justify-center z-[1000] hidden transition-opacity">
                    <div class="flex flex-col items-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600 mb-3"></div>
                        <p class="text-sm font-bold text-green-800">Получение данных...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    let map, marker;
    const API_KEY = 'c9cf19c2-9fb2-47de-afa2-460186a4759c';

    // Инициализация карты (по умолчанию Новосибирск)
    map = new mapgl.Map('map', {
        center: [82.9204, 55.0302],
        zoom: 12,
        key: API_KEY,
    });

    async function lookupIP() {
        const ip = document.getElementById('ipInput').value.trim();
        const btn = document.getElementById('searchBtn');
        const loader = document.getElementById('mapLoader');

        btn.disabled = true;
        loader.classList.remove('hidden');

        map.setCenter = function (pos) {
            
        };
        try {
            const response = await fetch(`https://ipwho.is/${ip}`);
            const data = await response.json();

            if (!data.success) throw new Error(data.message);

            // Заполнение UI
            document.getElementById('resISP').innerText = data.connection.isp;
            document.getElementById('resCity').innerText = `${data.city}, ${data.country}`;
            document.getElementById('resCoords').innerText = `${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}`;

            // Обновление карты
            const pos = [data.longitude, data.latitude];
            map.setCenter(pos);
            map.setZoom(13);

            if (marker) marker.destroy();
            marker = new mapgl.Marker(map, { coordinates: pos });

            calculateAccuracy(data);

        } catch (error) {
            alert('Ошибка: ' + error.message);
        } finally {
            btn.disabled = false;
            loader.classList.add('hidden');
        }
    }

    function calculateAccuracy(data) {
        let score = 0;
        let type;

        if (data.city) score += 30;
        if (data.postal) score += 20;
        if (data.connection.type === 'static') {
            score += 50;
            type = "Высокая точность: Статический адрес";
        } else if (data.connection.type === 'cable') {
            score += 40;
            type = "Средняя точность: Широкополосная сеть";
        } else {
            score += 15;
            type = "Низкая точность: Динамический/Мобильный IP";
        }

        document.getElementById('accuracyBar').style.width = score + '%';
        document.getElementById('accuracyVal').innerText = score + '%';
        document.getElementById('accuracyType').innerText = type;
    }

    function resetApp() {
        document.getElementById('ipInput').value = '';
        document.getElementById('resISP').innerText = '—';
        document.getElementById('resCity').innerText = '—';
        document.getElementById('resCoords').innerText = '—';
        document.getElementById('accuracyBar').style.width = '0%';
        document.getElementById('accuracyVal').innerText = '0%';
        document.getElementById('accuracyType').innerText = '—';

        if (marker) marker.destroy();
        map.setCenter([82.9204, 55.0302]);
        map.setZoom(12);
    }

    document.getElementById('ipInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') lookupIP();
    });

    // Авто-поиск при загрузке
     window.onload = lookupIP;
</script>
</body>
</html>
